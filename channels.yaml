# TikTok to YouTube Channel Pairs
#
# ch9 — onboarded 2026-07-26. Own repo + own GCP project under seamonshazel@gmail.com
# (standard policy: every channel fully de-correlated).

channels:
  - id: channel_9
    tiktok_username: "pati1902"
    youtube_channel_name: "Pati"
    # No fixed_title — the TikTok caption is used as the YouTube title.
    google_credentials_file: "credentials/channel_9_client_secret.json"
    oauth_token_file: "tokens/channel_9_token.json"
    videos_per_day: 2
    description_footer: ""
    default_tags:
      - pati1902
      - viral
      - trending
    youtube_category_id: "22"
    enabled: true
    max_retry_days: 7
    shorts_max_seconds: 180
    upload_mode: popular_split
    # Slot 1 = newest unposted TikTok. Slot 2 = most-VIEWED unposted TikTok
    # (across the whole profile). Both upload as Shorts.
    max_download_candidates: 20
    # Caption dedup: before uploading, skip any TikTok whose caption already exists
    # among ALL videos on the YouTube channel (catches manual uploads).
    # 2 videos were uploaded manually (the two most-viewed TikToks) — dedup skips them.
    youtube_uploads_playlist: "UU3w37lLqcUThOqCkSZ32cNw"
    # German-language content — timed for a German (CEST, UTC+2) audience.
    slot_publish_times_utc:
      1: "17:00"   # PUBLIC at 7 PM CEST (10 PM PKT) — German prime time
      2: "19:00"   # PUBLIC at 9 PM CEST (12 AM PKT) — German prime time
