name: Auto-update yt-dlp

on:
  schedule:
    # Every day at 6:00 AM UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get latest yt-dlp version
        id: latest
        run: |
          LATEST=$(pip index versions yt-dlp 2>/dev/null | grep -oP '(?<=Available versions: )[\d.]+' | head -1)
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest yt-dlp: $LATEST"

      - name: Get current pinned version
        id: current
        run: |
          CURRENT=$(grep '^yt-dlp' requirements.txt | grep -oP '[\d.]+$')
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current yt-dlp: $CURRENT"

      - name: Commit and push
        if: steps.update.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add requirements.txt
          git commit -m "chore: bump yt-dlp to ${{ steps.latest.outputs.version }}"
          git push

